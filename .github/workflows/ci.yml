# ══════════════════════════════════════════════════════════
# FirstCry CI Pipeline
# Runs on every push/PR to main and develop branches.
# Jobs: Frontend lint+build, Backend build
# ══════════════════════════════════════════════════════════

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Security audit (warn only)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:5181

  backend:
    name: Backend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/FirstCry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/FirstCry.API/FirstCry.API.csproj

      - name: Vulnerable package check (warn only)
        continue-on-error: true
        run: dotnet list src/FirstCry.API/FirstCry.API.csproj package --vulnerable --include-transitive

      - name: Build
        run: dotnet build src/FirstCry.API/FirstCry.API.csproj --no-restore --configuration Release
